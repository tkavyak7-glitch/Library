<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | Peaceful Reading Space</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span>Peaceful Library</span>
    </a>
    <ul class="nav-menu" id="nav-menu-container"></ul>
    <div class="nav-actions" id="nav-actions-container"></div>
  </nav>

  <main class="main-wrapper">

    <div style="max-width: 800px; margin: 0 auto;">

      <div class="card-bg" style="background-color: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 2.5rem; box-shadow: var(--shadow-subtle); margin-bottom: 2rem;">
        
        <div style="display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; margin-bottom: 2rem;">
          <div style="position: relative;">
            <img id="profile-img-preview" src="/uploads/avatars/default-avatar.png" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-light); box-shadow: var(--shadow-hover);" onerror="this.src='/uploads/avatars/default-avatar.png'">
          </div>
          <div>
            <h1 style="font-family: var(--font-heading); font-size: 1.8rem; color: var(--text-main);" id="profile-name-display">Reader Name</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;" id="profile-email-display">reader@library.com</p>
            <span class="badge badge-primary" style="margin-top: 0.5rem;" id="profile-role-badge">Standard Reader</span>
          </div>
        </div>

        <form id="profile-edit-form" enctype="multipart/form-data">
          
          <h3 style="font-family: var(--font-heading); font-size: 1.2rem; color: var(--text-main); margin-bottom: 1.25rem;">
            ✏️ Edit Profile Information
          </h3>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-bottom: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="edit-name">Full Name</label>
              <input type="text" id="edit-name" name="name" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-photo">Profile Photo</label>
              <input type="file" id="edit-photo" name="profilePhoto" accept="image/*" class="form-control">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label class="form-label" for="edit-bio">Bio & Reading Motto</label>
            <textarea id="edit-bio" name="bio" class="form-control" rows="2" placeholder="Tell us about your reading journey..."></textarea>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; margin-bottom: 1.75rem;">
            <div class="form-group">
              <label class="form-label" for="edit-favorite-genre">Favorite Genre</label>
              <input type="text" id="edit-favorite-genre" name="favoriteGenre" class="form-control" placeholder="e.g. Classic Literature">
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-daily-goal">Daily Goal (Minutes)</label>
              <input type="number" id="edit-daily-goal" name="dailyGoalMinutes" class="form-control" value="30" min="5" max="300">
            </div>

            <div class="form-group">
              <label class="form-label" for="edit-monthly-goal">Monthly Goal (Books)</label>
              <input type="number" id="edit-monthly-goal" name="monthlyGoalBooks" class="form-control" value="4" min="1" max="50">
            </div>
          </div>

          <button type="submit" class="btn btn-primary" style="padding: 0.75rem 2rem;">Save Profile Changes</button>
        </form>

      </div>

    </div>

  </main>

  <footer class="footer">
    <p>© 2026 Peaceful Book Library & Reading Tracker.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
