<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorite Books | Peaceful Reading Space</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      <span>Peaceful Library</span>
    </a>
    <ul class="nav-menu" id="nav-menu-container"></ul>
    <div class="nav-actions" id="nav-actions-container"></div>
  </nav>

  <main class="main-wrapper">

    <div class="section-header">
      <div>
        <h1 class="section-title">❤️ Favorite Bookshelf</h1>
        <p style="color: var(--text-muted);">Your handpicked collection of loved reads.</p>
      </div>
    </div>

    <!-- Search Favorites -->
    <div class="filter-bar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="fav-search-input" class="search-input" placeholder="Search favorite books by title or author...">
      </div>
    </div>

    <!-- Favorites Grid -->
    <div class="books-grid" id="favorites-grid-container">
      <!-- Rendered dynamically -->
    </div>

  </main>

  <footer class="footer">
    <p>© 2026 Peaceful Book Library & Reading Tracker.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/favorites.js"></script>
</body>
</html>
